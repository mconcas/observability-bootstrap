---
# Maps the built-in security roles to backend roles / users.
_meta:
  type: "rolesmapping"
  config_version: 2

all_access:
  reserved: true
  backend_roles:
    - "admin"
  description: "Maps the admin backend role to all_access (full cluster access)."

security_rest_api_access:
  reserved: true
  backend_roles:
    - "admin"
  description: "Allows the admin backend role to use the security REST API."
