receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Absolute limits (not percentage): limit_percentage reads the HOST's total
  # RAM, which on this co-located, swapless box means the limiter wouldn't trip
  # until otel reached ~11g — useless as a guardrail. Cap in absolute MiB so it
  # applies backpressure well before the host OOMs. Keep the container mem_limit
  # (docker-compose.yml) comfortably above spike_limit for headroom.
  memory_limiter:
    check_interval: 5s
    # Sized for the 2g container (docker-compose.yml). limit_mib is the soft cap
    # at which the collector REFUSES incoming data; it must track the container
    # size or the collector rejects most batches while sitting well under its
    # real limit (700 in a 2g box refused data almost continuously during bulk
    # replay). Hard trip = limit_mib + spike_limit_mib = 1656, leaving ~390 MiB
    # headroom below the 3072 container ceiling for Go RSS overshoot
    # (hard trip = limit_mib + spike_limit_mib = 2600).
    limit_mib: 2200
    spike_limit_mib: 400 # sudden bursts
  batch:
    timeout: 10s
    send_batch_size: 1024
  resourcedetection: # not sure it is necessary at this point yet
    detectors: [env, system]
    # Only fill resource attributes (e.g. host.name) that are not already
    # present on the incoming OTLP data. Without this, the system detector
    # overwrites a service-provided host.name. service.name is likewise
    # preserved (the logs_service transform below guards on service.name == nil).
    override: false
  # Transform processor: sets peer.service on CLIENT spans so that
  # Data Prepper's otel_apm_service_map processor can build destination
  # nodes in the Application Map topology.
  # Without peer.service, the service map only shows source-only edges.
  transform/peer_service:
    trace_statements:
      - context: span
        statements:
          # HTTP exporters: server.address is the hostname (e.g., "prometheus")
          - set(attributes["peer.service"], attributes["server.address"]) where kind == SPAN_KIND_CLIENT and attributes["server.address"] != nil
          # gRPC exporters: Go gRPC resolves hostname → IP before the span is created,
          # so server.address is an IP. Fix by mapping the known port to the service name.
          - set(attributes["peer.service"], "data-prepper") where kind == SPAN_KIND_CLIENT and attributes["server.port"] == 21890
  # Fix OpenSearch mapping conflict: otelcol.signal (keyword) vs
  # otelcol.signal.output (sub-field) in instrumentationScope.attributes.
  # Flatten dot-separated scope attribute names to underscores.
  transform/flatten_scope:
    log_statements:
      - context: scope
        statements:
          - set(attributes["otelcol.signal_output"], attributes["otelcol.signal.output"]) where attributes["otelcol.signal.output"] != nil
          - delete_key(attributes, "otelcol.signal.output") where attributes["otelcol.signal.output"] != nil
  # Extract service identity from InfoLogger's "facility" body field so that
  # OSD Trace Analytics can correlate logs ↔ services.
  # DPL sets InfoLoggerContext::Facility = DeviceSpec::name, which is the same
  # value used as the OTLP service.name in the tracing SDK.
  # Step 1: copy body["facility"] into a log-record attribute.
  # Step 2: groupbyattrs (below) promotes it to resource.attributes and regroups
  #         log records so each unique facility gets its own resource scope.
  transform/logs_service:
    log_statements:
      - context: log
        statements:
          # Deterministic content fingerprint used downstream as the OpenSearch
          # document _id (Data Prepper reads it as ${/attributes/log_uid}). Hash
          # the record's identifying content — event time (ns), body, severity,
          # and BOTH the log-record and resource attribute maps — into a stable
          # value. Computed FIRST, before the statements below mutate the record,
          # so a replayed record (after a collector/Data Prepper restart) hashes
          # to the same _id and overwrites instead of duplicating. SortOutput=true
          # makes the map serialization order-independent, hence reproducible.
          - set(attributes["log_uid"], SHA256(Concat([String(time_unix_nano), String(body), String(severity_number), ToKeyValueString(attributes, "=", " ", true), ToKeyValueString(resource.attributes, "=", " ", true)], "|")))
          # ObservedTimestamp arrives as 0 (→ 1970-01-01) when the source SDK
          # doesn't set observed_time_unix_nano. Backfill it from the event time
          # so it is meaningful (and consistent with `time`) for historical data.
          - set(observed_time, time) where observed_time_unix_nano == 0
          - set(attributes["service.name"], attributes["facility"]) where attributes["facility"] != nil and attributes["service.name"] == nil
          # Map InfoLogger single-letter severity to OTLP severity_text / severity_number
          - set(severity_text, "DEBUG")  where attributes["severity"] == "D"
          - set(severity_number, SEVERITY_NUMBER_DEBUG)  where attributes["severity"] == "D"
          - set(severity_text, "INFO")   where attributes["severity"] == "I"
          - set(severity_number, SEVERITY_NUMBER_INFO)   where attributes["severity"] == "I"
          - set(severity_text, "WARN")   where attributes["severity"] == "W"
          - set(severity_number, SEVERITY_NUMBER_WARN)   where attributes["severity"] == "W"
          - set(severity_text, "ERROR")  where attributes["severity"] == "E"
          - set(severity_number, SEVERITY_NUMBER_ERROR)  where attributes["severity"] == "E"
          - set(severity_text, "FATAL")  where attributes["severity"] == "F"
          - set(severity_number, SEVERITY_NUMBER_FATAL)  where attributes["severity"] == "F"
  groupbyattrs/logs:
    keys:
      - service.name

exporters:
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_grpc/data-prepper:
    endpoint: data-prepper:21890
    tls:
      insecure: true

connectors:
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 50ms, 100ms, 1s, 5s, 10s]

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: warn
    traces:
      level: none

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/peer_service, batch]
      exporters: [otlp_grpc/data-prepper, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp_http/prometheus]
      # exporters: [otlp_http/prometheus, otlp_grpc/data-prepper]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform/flatten_scope, transform/logs_service, groupbyattrs/logs, batch]
      exporters: [otlp_grpc/data-prepper]