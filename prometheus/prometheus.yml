global:
  scrape_interval: 5s
  evaluation_interval: 15s # how often alerting rules and recording rules are evaluated

otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id

storage:
  tsdb:
    # Accept out-of-order samples within a 30m window.
    # Needed when Data Prepper pushes RED metrics at irregular intervals.
    out_of_order_time_window: 30m

# Vanilla default: no self-scrapes. Prometheus only stores metrics it receives
# via the OTLP receiver (--web.enable-otlp-receiver) and remote-write
# (--web.enable-remote-write-receiver) — i.e. external/app telemetry forwarded by
# the otel-collector and Data Prepper, not the stack's own internal metrics.
#
# To scrape the stack's own components (prometheus, otel-collector, data-prepper),
# use docker-compose.self-monitoring.yml, which mounts prometheus.self-monitoring.yml
# in place of this file.
scrape_configs: []
