# Vanilla default: the stack runs ready to ingest EXTERNAL telemetry (OTLP on
# 4317/4318, InfoLogger on the fluent-bit syslog socket) but injects none of its
# own. No component ships its container logs to fluent-bit, and Prometheus does
# not scrape the stack's own components.
#
# To re-enable the stack's self-instrumentation (container logs + self-scrapes),
# layer the overlay on top:
#   docker compose -f docker-compose.yml -f docker-compose.self-monitoring.yml up -d
services:
  fluent-bit:
    image: fluent/fluent-bit:${FLUENTBIT_VERSION}
    container_name: fluent-bit
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /etc/fluent-bit/fluent-bit.yml
    ports:
      - "24224:24224"
    volumes:
     - ./fluent-bit/fluent-bit.yml:/etc/fluent-bit/fluent-bit.yml
     - ./fluent-bit/parsers.yml:/etc/fluent-bit/parsers.yml
     - fluentbit-socket:/tmp/fluent-bit-socket

  opensearch:
    image: ${OPENSEARCH_DOCKER_REPO}/opensearch:${OPENSEARCH_VERSION}
    container_name: opensearch
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms8g -Xmx8g"
      # Security plugin stays enabled, but we own every bit of its config: skip
      # the bundled demo installer entirely (no auto-generated certs, no
      # auto-written opensearch.yml). Certs come from scripts/gen-certs.sh and
      # the security config is mounted below.
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/certs:/usr/share/opensearch/config/certs:ro
      - ./opensearch/securityconfig/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./opensearch/securityconfig/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - ./opensearch/securityconfig/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
    healthcheck:
      test: curl -s -u "admin:${OPENSEARCH_PASSWORD}" http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 10

  opensearch-dashboards:
    image: ${OPENSEARCH_DOCKER_REPO}/opensearch-dashboards:${OPENSEARCH_DASHBOARDS_VERSION}
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      # Security dashboards plugin stays enabled (provides the login screen).
      # OSD authenticates to OpenSearch with these credentials; OPENSEARCH_USERNAME
      # / OPENSEARCH_PASSWORD map to opensearch.username / opensearch.password.
      - OPENSEARCH_USERNAME=admin
      - "OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}"
    volumes:
        - ./opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    depends_on:
      opensearch:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=15d
    ports:
     - "9090:9090"
    volumes:
      - prometheus-data:/prometheus # docker volume
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro # local volume
    healthcheck:
      test: wget -q --spider http://localhost:9090/-/healthy
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_CONTRIB_VERSION}
    container_name: otel-collector
    command:
     - --config=/etc/otelcol-contrib/config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      data-prepper:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      disable: true

  data-prepper:
    image: opensearchproject/data-prepper:${DATA_PREPPER_VERSION}
    container_name: data-prepper
    volumes:
      - ./data-prepper/pipelines.yml:/usr/share/data-prepper/pipelines/pipelines.yml:ro
      - ./data-prepper/data-prepper-config.yml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      fluent-bit:
        condition: service_started

  # One-shot init container: registers Prometheus data source + index patterns in OSD
  # Uses python:3-alpine because we need both curl and python3 for JSON parsing.
  opensearch-dashboards-init:
    image: python:3-alpine
    container_name: opensearch-dashboards-init
    entrypoint: ["python3", "/init-datasource.py"]
    environment:
      # The OSD API now requires authentication; the init script reads these.
      - OSD_USERNAME=admin
      - "OSD_PASSWORD=${OPENSEARCH_PASSWORD}"
    volumes:
      - ./opensearch-dashboards/init-datasource.sh:/init-datasource.sh:ro
      - ./opensearch-dashboards/init-datasource.py:/init-datasource.py:ro
    depends_on:
      opensearch-dashboards:
        condition: service_started
    restart: "no"

networks:
  default:
    name: ${NETWORK_NAME}

volumes:
  opensearch-data:
  prometheus-data:
  fluentbit-socket: