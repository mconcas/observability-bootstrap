# Bare base: the most vanilla configuration. The stack runs ready to ingest
# EXTERNAL telemetry (OTLP on 4317/4318, InfoLogger on the fluent-bit syslog
# socket) but injects none of its own and runs NO initialization script — no
# data sources or index patterns are pre-registered in Dashboards. No component
# ships its container logs to fluent-bit, and Prometheus does not scrape the
# stack's own components.
#
# Deploy a named configuration with the wrapper, which layers the right overlays:
#   ./deploy.sh bare              # this file only (no init, no self-monitoring)
#   ./deploy.sh default           # + docker-compose.init.yml (Dashboards init)
#   ./deploy.sh self-monitoring   # + the stack observes itself
#
# Or layer the overlays by hand:
#   docker compose -f docker-compose.yml -f docker-compose.init.yml up -d
services:
  fluent-bit:
    image: fluent/fluent-bit:${FLUENTBIT_VERSION}
    container_name: fluent-bit
    mem_limit: 256m
    command:
      - /fluent-bit/bin/fluent-bit
      - -c
      - /etc/fluent-bit/fluent-bit.yml
    ports:
      - "24224:24224"
    volumes:
     - ./fluent-bit/fluent-bit.yml:/etc/fluent-bit/fluent-bit.yml
     - ./fluent-bit/parsers.yml:/etc/fluent-bit/parsers.yml
     - fluentbit-socket:/tmp/fluent-bit-socket

  opensearch:
    image: ${OPENSEARCH_DOCKER_REPO}/opensearch:${OPENSEARCH_VERSION}
    container_name: opensearch
    environment:

      - "OPENSEARCH_JAVA_OPTS=-Xms3g -Xmx3g"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./opensearch/certs:/usr/share/opensearch/config/certs:ro
      - ./opensearch/securityconfig/internal_users.yml:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
      - ./opensearch/securityconfig/roles_mapping.yml:/usr/share/opensearch/config/opensearch-security/roles_mapping.yml:ro
      - ./opensearch/securityconfig/config.yml:/usr/share/opensearch/config/opensearch-security/config.yml:ro
    healthcheck:
      test: curl -s -u "admin:${OPENSEARCH_PASSWORD}" http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 10

  opensearch-dashboards:
    image: ${OPENSEARCH_DOCKER_REPO}/opensearch-dashboards:${OPENSEARCH_DASHBOARDS_VERSION}
    container_name: opensearch-dashboards
    mem_limit: 1g
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - "OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}"
    volumes:
        - ./opensearch-dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    depends_on:
      opensearch:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: prometheus
    mem_limit: 1g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=15d
    ports:
     - "9090:9090"
    volumes:
      - prometheus-data:/prometheus # docker volume
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro # local volume
    healthcheck:
      test: wget -q --spider http://localhost:9090/-/healthy
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_CONTRIB_VERSION}
    container_name: otel-collector
    mem_limit: 3g
    # Recover automatically after a memory spike instead of staying dead.
    restart: unless-stopped
    command:
     - --config=/etc/otelcol-contrib/config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      data-prepper:
        condition: service_started
      prometheus:
        condition: service_healthy
    healthcheck:
      disable: true

  data-prepper:
    image: opensearchproject/data-prepper:${DATA_PREPPER_VERSION}
    container_name: data-prepper
    mem_limit: 1500m
    volumes:
      - ./data-prepper/pipelines.yml:/usr/share/data-prepper/pipelines/pipelines.yml:ro
      - ./data-prepper/data-prepper-config.yml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
    depends_on:
      opensearch:
        condition: service_healthy
      fluent-bit:
        condition: service_started

networks:
  default:
    name: ${NETWORK_NAME}

volumes:
  opensearch-data:
  prometheus-data:
  fluentbit-socket:
